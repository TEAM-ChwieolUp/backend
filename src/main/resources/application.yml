spring:
  application:
    name: demo
  profiles:
    default: local
  security:
    oauth2:
      client:
        registration:
          google:
            scope:
              - openid
              - profile
              - email

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  openapi:
    title: CheerUp API
    description: ChwieolUp backend API documentation
    version: v1
    servers:
      - url: http://localhost:8080
        description: Local server

cheerup:
  ai:
    retrospective:
      question-path: /ai/retrospective/questions
      connect-timeout: 1s
      read-timeout: 8s
      default-question-count: 4
      max-question-count: 15
      daily-limit: 50
