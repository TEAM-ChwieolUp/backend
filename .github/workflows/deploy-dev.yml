name: Deploy Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/team-chwieolup/backend
  DEPLOY_PATH: ${{ secrets.DEV_DEPLOY_PATH || '/opt/cheerup/backend' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: bash ./gradlew clean test --no-daemon

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:dev
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout backend-security
        run: |
          git config --global url."https://x-access-token:${{ secrets.BACKEND_SECURITY_TOKEN }}@github.com/TEAM-ChwieolUp/backend-security.git".insteadOf "https://github.com/TEAM-ChwieolUp/backend-security.git"
          git submodule update --init --recursive src/main/resources/backend-security

      - name: Prepare deployment files
        run: |
          set -e
          mkdir -p deploy/package
          cp deploy/docker-compose.dev.yml deploy/package/docker-compose.dev.yml
          cp src/main/resources/backend-security/application-security.yml deploy/package/application-security.yml
          ruby <<'RUBY'
          require "yaml"

          security_path = "src/main/resources/backend-security/application-security.yml"
          documents = YAML.load_stream(File.read(security_path)).compact
          dev = documents.find do |document|
            profile = document.dig("spring", "config", "activate", "on-profile")
            profile.to_s.split(",").map(&:strip).include?("dev")
          end

          abort "Missing dev profile in #{security_path}" unless dev

          datasource = dev.dig("spring", "datasource") || {}
          deploy = dev["deploy"] || {}
          mysql = deploy["mysql"] || {}
          app = deploy["app"] || {}

          database = mysql["database"] || datasource["url"].to_s[%r{jdbc:mysql://[^/]+/([^?]+)}, 1]
          values = {
            "APP_PORT" => app["port"] || 8080,
            "MYSQL_DATABASE" => database,
            "MYSQL_USER" => mysql["user"] || datasource["username"],
            "MYSQL_PASSWORD" => mysql["password"] || datasource["password"],
            "MYSQL_ROOT_PASSWORD" => mysql["root-password"],
          }

          missing = values.select { |_, value| value.to_s.empty? }.keys
          abort "Missing compose env values in #{security_path}: #{missing.join(", ")}" if missing.any?

          File.write(
            "deploy/package/.env.compose",
            values.map { |key, value| "#{key}=#{value}" }.join("\n") + "\n",
          )
          RUBY

      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: deploy/package/*
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 2

      - name: Restart service
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_NAME
          script: |
            set -e
            cd "${{ env.DEPLOY_PATH }}"
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker is not installed or is not available in PATH for this SSH user."
              echo "Install Docker Engine and the Docker Compose plugin on the dev server before deploying."
              exit 127
            fi
            if ! docker compose version >/dev/null 2>&1; then
              echo "Docker Compose plugin is not available for this SSH user."
              echo "Install docker-compose-plugin on the dev server before deploying."
              exit 127
            fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            APP_IMAGE="$IMAGE_NAME:dev" docker compose --env-file .env.compose -f docker-compose.dev.yml pull app
            APP_IMAGE="$IMAGE_NAME:dev" docker compose --env-file .env.compose -f docker-compose.dev.yml up -d app
            docker image prune -f
